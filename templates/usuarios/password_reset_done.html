{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConEvent - Correo Enviado</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box" style="text-align: center;">
            <h2><i class="fas fa-envelope-open-text" style="color: #4f8ef7;"></i></h2>
            <h3 style="color: white; margin: 12px 0;">¡Correo enviado!</h3>
            <p style="color: var(--gris-claro); margin-bottom: 24px;">
                Si tu correo está registrado en el sistema, recibirás un enlace para restablecer tu contraseña en unos minutos.
                Revisa también tu carpeta de spam.
            </p>
            <a href="{% url 'login' %}" class="btn-login" style="display: block; text-decoration: none; text-align: center;">
                <i class="fas fa-arrow-left"></i> Regresar al login
            </a>
        </div>
    </div>
</body>
</html>
