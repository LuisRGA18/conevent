{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConEvent - Restablecer Contraseña</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2><i class="fas fa-key"></i> Restablecer Contraseña</h2>
            <p style="color: var(--gris-claro); margin-bottom: 20px;">
                Ingresa tu correo institucional y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label for="email"><i class="fas fa-envelope"></i> Correo Institucional</label>
                    <input type="email" id="email" name="email"
                           placeholder="tu_correo@uteq.edu.mx" required>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-paper-plane"></i> Enviar Enlace
                </button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: var(--gris-claro); font-size: 0.9rem;">
                <a href="{% url 'login' %}" style="color: var(--azul-acento, #4f8ef7); text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Regresar al login
                </a>
            </p>
        </div>
    </div>
</body>
</html>
