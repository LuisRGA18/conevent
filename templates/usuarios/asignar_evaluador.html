{% extends "seguridad/index.html" %}
{% block content %}
<div class="container py-4" style="max-width: 500px;">

  <a href="{% url 'panel_admin' %}" class="text-secondary text-decoration-none">
    <i class="bi bi-arrow-left me-1"></i> Regresar al panel
  </a>

  <h4 class="fw-bold text-white mt-3 mb-4">Asignar Evaluador</h4>

  <div class="card bg-dark border-secondary mb-4">
    <div class="card-body">
      <p class="text-muted mb-1">Proyecto:</p>
      <h5 class="text-white">{{ proyecto.titulo }}</h5>
      <small class="text-secondary">{{ proyecto.codigo }}</small>
    </div>
  </div>

  <div class="card bg-dark border-secondary">
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-4">
          <label class="form-label text-white fw-semibold">{{ form.evaluador_asignado.label }}</label>
          {{ form.evaluador_asignado }}
        </div>
        <div class="d-flex justify-content-end gap-2">
          <a href="{% url 'panel_admin' %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-person-check me-1"></i> Asignar
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
