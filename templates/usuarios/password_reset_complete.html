{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConEvent - Contraseña Restablecida</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box" style="text-align: center;">
            <h2><i class="fas fa-check-circle" style="color: #2ecc71;"></i></h2>
            <h3 style="color: white; margin: 12px 0;">¡Contraseña restablecida!</h3>
            <p style="color: var(--gris-claro); margin-bottom: 24px;">
                Tu contraseña fue cambiada con éxito. Ya puedes iniciar sesión con tu nueva contraseña.
            </p>
            <a href="{% url 'login' %}" class="btn-login"
               style="display: block; text-decoration: none; text-align: center;">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </a>
        </div>
    </div>
</body>
</html>
