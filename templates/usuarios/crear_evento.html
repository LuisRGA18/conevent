{% extends "landing_base.html" %}
{% block content %}
<div style="max-width:600px; margin:40px auto; padding:20px; background:#fff; border-radius:12px; border:1px solid #dce6f0;">
  <h2>Crear Nuevo Evento Académico</h2>
  <form method="POST">
    {% csrf_token %}
    <div style="margin-bottom:15px;">
      <label>Nombre del Evento:</label>
      <input type="text" name="nombre" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;">
    </div>
    <div style="margin-bottom:15px;">
      <label>Descripción:</label>
      <textarea name="descripcion" style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;"></textarea>
    </div>
    <div style="display:flex; gap:10px; margin-bottom:15px;">
      <div style="flex:1;">
        <label>Fecha Inicio:</label>
        <input type="date" name="fecha_inicio" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;">
      </div>
      <div style="flex:1;">
        <label>Fecha Fin:</label>
        <input type="date" name="fecha_fin" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;">
      </div>
    </div>
    <div style="margin-bottom:20px;">
      <label>Recinto Asignado:</label>
      <select name="recinto_id" required style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;">
        {% for recinto in recintos %}
          <option value="{{ recinto.id }}">{{ recinto.nombre }} — {{ recinto.descripcion }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" style="background:#0b3c5d; color:#fff; padding:10px 20px; border:none; border-radius:6px; cursor:pointer;">Crear Evento</button>
  </form>
</div>
{% endblock %}
